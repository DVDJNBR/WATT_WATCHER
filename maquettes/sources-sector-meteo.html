<!doctype html>
<title>Centrales électriques — France</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
:root {
  --bg:#f7f5f2;--surface:#ffffff;--surface-2:#f0ede8;
  --border:rgba(20,20,22,.10);--text:#1c1c1e;--text-muted:#6b6b70;
  --accent:#0f9c8f;
  --map-bg:#edeae5;--map-fill:rgba(20,20,22,.03);--map-stroke:rgba(20,20,22,.16);
  --label-col:rgba(20,20,22,.45);
}
:root[data-theme="dark"]{
  --bg:#0d0d0f;--surface:#17171b;--surface-2:#1e1e23;
  --border:rgba(255,255,255,.09);--text:#f2f2f0;--text-muted:#9a9a9e;
  --accent:#2dd4bf;
  --map-bg:#111114;--map-fill:rgba(255,255,255,.03);--map-stroke:rgba(255,255,255,.11);
  --label-col:rgba(255,255,255,.40);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0d0f;--surface:#17171b;--surface-2:#1e1e23;
  --border:rgba(255,255,255,.09);--text:#f2f2f0;--text-muted:#9a9a9e;
  --accent:#2dd4bf;
  --map-bg:#111114;--map-fill:rgba(255,255,255,.03);--map-stroke:rgba(255,255,255,.11);
  --label-col:rgba(255,255,255,.40);
}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;min-height:100vh}
.page{max-width:1080px;margin:0 auto;padding:28px 20px 48px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
h1{font-size:24px;font-weight:700;letter-spacing:-.01em;margin:0 0 5px}
.subtitle{font-size:13.5px;color:var(--text-muted);margin:0;max-width:52ch;line-height:1.5}
.stage-shell{background:var(--map-bg);border:1px solid var(--border);border-radius:12px;overflow:hidden;position:relative}
.stage-wrap{position:relative;width:100%;aspect-ratio:1.023}
canvas{display:block;width:100%;height:100%;cursor:default}
#windCanvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;border-radius:12px;}
.loading-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-muted);pointer-events:none;transition:opacity .3s}
.loading-overlay.hidden{opacity:0;pointer-events:none}
.tooltip{
  position:absolute;pointer-events:none;z-index:10;opacity:0;
  transform:translate(-50%,calc(-100% - 14px));transition:opacity .1s ease;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:9px 13px;min-width:150px;box-shadow:0 6px 20px rgba(0,0,0,.2);font-size:12px;line-height:1.55
}
.tooltip.show{opacity:1}
.t-name{font-weight:700;font-size:12.5px;margin:0 0 3px}
.t-row{color:var(--text-muted);margin:0 0 1px}
.t-mw{font-weight:600;font-variant-numeric:tabular-nums;margin:0}
.legend-bar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:12px 18px;border-top:1px solid var(--border);background:var(--surface-2)}
.l-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted)}
.l-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-muted)}
.l-dot{width:9px;height:9px;border-radius:50%;flex:none}
.l-sep{width:1px;height:20px;background:var(--border);flex:none}
.l-note{font-size:11px;color:var(--text-muted);margin-left:auto;white-space:nowrap}
.btn-theme{appearance:none;background:none;border:1px solid var(--border);color:var(--text-muted);border-radius:6px;padding:6px 12px;font:inherit;font-size:11.5px;font-weight:600;cursor:pointer;transition:border-color .12s,color .12s;white-space:nowrap}
.btn-theme:hover{border-color:var(--accent);color:var(--accent)}
</style>

<div class="page">
  <header class="top">
    <div>
      <p class="eyebrow">Watt Watcher — Concept</p>
      <h1>Centrales électriques de France</h1>

    </div>
    <button class="btn-theme" id="themeBtn">Clair</button>

    </div>

      <div class="l-sep"></div>

    </div>
  </div>
</div>

// National installed capacity (MW) — used for CF denominator, not subset totals
var _NATIONAL_MW = {nucleaire:63100,hydraulique:25800,eolien:24100,solaire:78700,thermique:20000,autre:5000};

// Live mix state — updated from ODRE eco2mix
var _capFactor   = {nucleaire:1,hydraulique:1,eolien:1,solaire:1,thermique:1,autre:1};
var _installedMW = {};  // sum installed MW per filière (dataset subset, sizing only)

var R_MIN = 2.5, R_MAX = 11.0;

// Per-site CF — overrides filière-level CF for eolien/solaire using local weather
var _siteCF = [];
var _weatherGrid = [];

// ── Météo : grille 22×16 à 0.75° (352 pts) — approche nuages.html ────────────
var DLON=0.75,DLAT=0.75,G_LON0=-5.0,G_LAT0=41.0,G_NCOL=22,G_NROW=16;
var _cloudGrid=null,_ugrid=null,_vgrid=null;
var _cloudRasterCanvas=null;

// inverse Mercator : pixel canvas → (lon,lat)
function unproj(px,py,cW,cH){
  var lon=LON_MIN+(px-PAD)/(cW-2*PAD)*(LON_MAX-LON_MIN);
  var m=YMN+(1-(py-PAD)/(cH-2*PAD))*(YMX-YMN);
  var lat=(2*Math.atan(Math.exp(m))-Math.PI/2)*180/Math.PI;
  return[lon,lat];
}

// bicubic helpers
function gv(arr,ci,ri){return arr[Math.max(0,Math.min(G_NROW-1,ri))*G_NCOL+Math.max(0,Math.min(G_NCOL-1,ci))];}
function cubicH(p0,p1,p2,p3,t){return 0.5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t*t+(-p0+3*p1-3*p2+p3)*t*t*t);}
function bicubic(arr,gx,gy){
  var ci=Math.floor(gx),ri=Math.floor(gy);
  var tx=gx-ci,ty=gy-ri;
  var rows=[];
  for(var dr=-1;dr<=2;dr++){
    rows.push(cubicH(gv(arr,ci-1,ri+dr),gv(arr,ci,ri+dr),gv(arr,ci+1,ri+dr),gv(arr,ci+2,ri+dr),tx));
  }
  return cubicH(rows[0],rows[1],rows[2],rows[3],ty);
}

// Build cloud raster (160×112 offscreen canvas)
var OW=160,OH=112;
var _rasterDark=null;
function buildRaster(){
  if(!_cloudGrid) return;
  var dark=isDark();
  _rasterDark=dark;
  var cr=0,cg=0,cb=0;
  var MAX_ALPHA=dark?150:90;
  var oc=document.createElement("canvas"); oc.width=OW; oc.height=OH;
  var ox=oc.getContext("2d");
  var img=ox.createImageData(OW,OH);
  var px=img.data;
  for(var row=0;row<OH;row++){
    for(var col=0;col<OW;col++){
      var ll=unproj(col/OW*W,row/OH*H,W,H);
      var gx=(ll[0]-G_LON0)/DLON,gy=(ll[1]-G_LAT0)/DLAT;
      var cloud=bicubic(_cloudGrid,gx,gy);
      cloud=Math.max(0,Math.min(100,cloud));
      var alpha=cloud<2?0:Math.round(MAX_ALPHA*Math.sqrt(cloud/100));
      var i=(row*OW+col)*4;
      px[i]=cr;px[i+1]=cg;px[i+2]=cb;px[i+3]=alpha;
    }
  }
  ox.putImageData(img,0,0);
  _cloudRasterCanvas=oc;
}

// UV map (precomputed every UVS px)
var UVS=8,uvU=null,uvV=null,_uvW=0,_uvH=0;
function buildUVMap(){
  if(!_ugrid||!_vgrid) return;
  _uvW=Math.ceil(W/UVS)+1; _uvH=Math.ceil(H/UVS)+1;
  uvU=new Float32Array(_uvW*_uvH);
  uvV=new Float32Array(_uvW*_uvH);
  for(var r=0;r<_uvH;r++){
    for(var c=0;c<_uvW;c++){
      var ll=unproj(c*UVS,r*UVS,W,H);
      var gx=(ll[0]-G_LON0)/DLON,gy=(ll[1]-G_LAT0)/DLAT;
      uvU[r*_uvW+c]=bicubic(_ugrid,gx,gy);
      uvV[r*_uvW+c]=bicubic(_vgrid,gx,gy);
    }
  }
}
function windAt(x,y){
  var c=x/UVS,r=y/UVS;
  var ci=Math.floor(c),ri=Math.floor(r);
  var tx=c-ci,ty=r-ri;
  function bi(arr,ci2,ri2){return arr[Math.max(0,Math.min(_uvH-1,ri2))*_uvW+Math.max(0,Math.min(_uvW-1,ci2))];}
  var u=(1-tx)*((1-ty)*bi(uvU,ci,ri)+ty*bi(uvU,ci,ri+1))+tx*((1-ty)*bi(uvU,ci+1,ri)+ty*bi(uvU,ci+1,ri+1));
  var v=(1-tx)*((1-ty)*bi(uvV,ci,ri)+ty*bi(uvV,ci,ri+1))+tx*((1-ty)*bi(uvV,ci+1,ri)+ty*bi(uvV,ci+1,ri+1));
  return[u,v];
}

// France mask (half-res pour inFrance())
var MW2=0,MH2=0,franceMask=null;
function buildFranceMask(){
  MW2=Math.ceil(W/2)+1; MH2=Math.ceil(H/2)+1;
  var mc=document.createElement("canvas"); mc.width=MW2; mc.height=MH2;
  var mx=mc.getContext("2d");
  mx.fillStyle="#000";
  Object.values(regionPaths).forEach(function(p2){
    mx.save();
    mx.setTransform(0.5,0,0,0.5,0,0);
    mx.fill(p2);
    mx.restore();
  });
  franceMask=mx.getImageData(0,0,MW2,MH2).data;
}
function inFrance(x,y){
  var cx=Math.round(x/2),cy=Math.round(y/2);
  if(cx<0||cy<0||cx>=MW2||cy>=MH2) return false;
  return franceMask[(cy*MW2+cx)*4+3]>128;
}

// Particles
var NPART=60,SPEED=0.10,FADE=0.94,MAX_AGE=220;
var particles=[];
var spawnPool=[],POOL_SIZE=500,animRAF=null;

function buildSpawnPool(){
  spawnPool=[];
  var tries=0;
  while(spawnPool.length<POOL_SIZE&&tries<20000){
    tries++;
    var x=PAD+Math.random()*(W-2*PAD);
    var y=PAD+Math.random()*(H-2*PAD);
    if(inFrance(x,y)) spawnPool.push([x,y]);
  }
}
function randomSpawn(){
  var s=spawnPool[Math.floor(Math.random()*spawnPool.length)];
  return s||[W/2,H/2];
}
function initParticles(){
  particles=[];
  for(var i=0;i<NPART;i++){
    var s=randomSpawn();
    particles.push({x:s[0],y:s[1],age:Math.floor(Math.random()*MAX_AGE)});
  }
}

var wCanvas=document.getElementById("windCanvas");
var wctx=wCanvas.getContext("2d");

function startAnim(){
  if(animRAF) cancelAnimationFrame(animRAF);
  var dark=isDark();
  function tick(){
    // Fade existing trails
    wctx.globalCompositeOperation="destination-in";
    wctx.fillStyle="rgba(0,0,0,"+FADE+")";
    wctx.fillRect(0,0,wCanvas.width,wCanvas.height);
    wctx.globalCompositeOperation="source-over";
    wctx.strokeStyle=dark?"rgba(200,196,188,0.30)":"rgba(40,40,40,0.30)";
    wctx.lineWidth=2.0; wctx.lineCap="round";
    wctx.save(); wctx.setTransform(dpr,0,0,dpr,0,0);
    wctx.beginPath();
    for(var i=0;i<particles.length;i++){
      var p=particles[i];
      var uv=windAt(p.x,p.y);
      var nx=p.x+uv[0]*SPEED,ny=p.y+uv[1]*SPEED;
      p.age++;
      if(p.age>MAX_AGE||!inFrance(nx,ny)){
        var s=randomSpawn(); p.x=s[0]; p.y=s[1]; p.age=0; continue;
      }
      wctx.moveTo(p.x,p.y); wctx.lineTo(nx,ny);
      p.x=nx; p.y=ny;
    }
    wctx.stroke();
    wctx.restore();
    animRAF=requestAnimationFrame(tick);
  }
  tick();
}

function drawCloudRaster(){
  if(!_cloudGrid) return;
  if(_rasterDark!==isDark()) buildRaster();
  if(!_cloudRasterCanvas) return;
  ctx.save();
  ctx.clip(francePath);
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality="high";
  ctx.drawImage(_cloudRasterCanvas,0,0,W,H);
  ctx.restore();
}

// Nearest-grid lookup for per-site CF (solar/wind still use per-site)
function _nearestGrid(lat,lon){
  if(!_cloudGrid) return null;
  var bestI=0,bestD=Infinity;
  for(var ri=0;ri<G_NROW;ri++){
    for(var ci=0;ci<G_NCOL;ci++){
      var la=G_LAT0+ri*DLAT,lo=G_LON0+ci*DLON;
      var d=(la-lat)*(la-lat)+(lo-lon)*(lo-lon);
      if(d<bestD){bestD=d;bestI=ri*G_NCOL+ci;}
    }
  }
  return bestI;
}

// API app_v2 — dev: http://localhost:8002  prod: /api (reverse proxy Caddy)
var METEO_GRID_API=(location.hostname==="localhost"||location.hostname==="127.0.0.1")
  ?"http://localhost:8002/v1/meteo/grid":"/api/v1/meteo/grid";

function loadWeather(){
  fetch(METEO_GRID_API).then(function(r){return r.json();}).then(function(resp){
    var arr=(resp&&resp.data)||[];
    _cloudGrid=new Float32Array(G_NROW*G_NCOL);
    _ugrid=new Float32Array(G_NROW*G_NCOL);
    _vgrid=new Float32Array(G_NROW*G_NCOL);
    _weatherGrid=new Array(G_NROW*G_NCOL);
    // Initialise fallback
    for(var k=0;k<G_NROW*G_NCOL;k++){
      _cloudGrid[k]=0;_ugrid[k]=0;_vgrid[k]=0;
      _weatherGrid[k]={lat:0,lon:0,cloud:0,wind:5,windDir:0};
    }
    arr.forEach(function(pt){
      var ri=Math.round((pt.lat-G_LAT0)/DLAT);
      var ci=Math.round((pt.lon-G_LON0)/DLON);
      if(ri<0||ri>=G_NROW||ci<0||ci>=G_NCOL) return;
      var idx=ri*G_NCOL+ci;
      var wd=pt.wind_direction*Math.PI/180;
      _cloudGrid[idx]=pt.cloud_cover;
      _ugrid[idx]=-pt.wind_speed*Math.sin(wd);
      _vgrid[idx]=pt.wind_speed*Math.cos(wd);
      _weatherGrid[idx]={lat:pt.lat,lon:pt.lon,
        cloud:pt.cloud_cover,wind:pt.wind_speed,windDir:pt.wind_direction};
    });
    _siteCF=heroPts.map(function(p){
      var baseCF=_capFactor[p.f]||0;
      if(p.f==="solaire"||p.f==="eolien"){
        var gi=_nearestGrid(p.lat||0,p.lon||0);
        if(gi!==null){
          var cloud=_cloudGrid[gi],ws=_weatherGrid[gi].wind;
          if(p.f==="solaire") return baseCF*(1-cloud/100);
          if(p.f==="eolien")  return baseCF*Math.min(1,ws/10);
        }
      }
      return baseCF;
    });
    // Build raster + UV map + France mask + particles
    buildRaster();
    buildUVMap();
    buildFranceMask();
    buildSpawnPool();
    initParticles();
    startAnim();
    draw();
  }).catch(function(){
    _siteCF=heroPts.map(function(p){return _capFactor[p.f]||0;});
  });
}

// ODRE eco2mix fields → our filière keys
var ODRE_TO_F = {nucleaire:"nucleaire",hydraulique:"hydraulique",eolien:"eolien",solaire:"solaire",
  gaz:"thermique",fioul:"thermique",charbon:"thermique",bioenergies:"autre"};

function loadMix(){
  var url="https://odre.opendatasoft.com/api/explore/v2.1/catalog/datasets/eco2mix-national-tr/records"+
    "?limit=1&select=date_heure,nucleaire,hydraulique,eolien,solaire,fioul,charbon,gaz,bioenergies"+
    "&order_by=date_heure+desc&where=nucleaire+is+not+null";
  fetch(url).then(function(r){return r.json();}).then(function(d){
    var rec=d.results&&d.results[0];
    if(!rec) return;
    // Aggregate ODRE fields per our filière
    var actual={nucleaire:0,hydraulique:0,eolien:0,solaire:0,thermique:0,autre:0};
    Object.keys(ODRE_TO_F).forEach(function(k){
      var f=ODRE_TO_F[k]; var v=rec[k]||0;
      actual[f]=(actual[f]||0)+(v>0?v:0);
    });
    // Compute capacity factors + mix shares
    var totalMW=Object.values(actual).reduce(function(a,b){return a+b;},0)||1;
    FILIERES.forEach(function(f){
      var inst=_NATIONAL_MW[f]||_installedMW[f]||1;
      _capFactor[f]=Math.min(1.0, actual[f]/inst);
    });
    // Update UI
    var ts=rec.date_heure?new Date(rec.date_heure).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):"";
    document.getElementById("mixTs").textContent="Mix J-1 "+ts;
    var total=Object.values(actual).reduce(function(a,b){return a+b;},0);
    var parts=["nucl. "+Math.round(actual.nucleaire/1000)+"GW",
      "hydro "+Math.round(actual.hydraulique/1000)+"GW",
      "éol. "+Math.round(actual.eolien/1000)+"GW",
      "sol. "+Math.round(actual.solaire/1000)+"GW",
      "therm. "+Math.round(actual.thermique/1000)+"GW"];
    document.getElementById("mixNote").textContent=parts.join(" · ");
    _siteCF=heroPts.map(function(p){return _capFactor[p.f]||0;});
    draw();
    loadWeather();
  }).catch(function(){document.getElementById("mixNote").textContent="Mix indisponible";});
}

var canvas=document.getElementById("map");
var ctx=canvas.getContext("2d");
var tooltip=document.getElementById("tooltip");
var loadingOverlay=document.getElementById("loadingOverlay");
var dpr=Math.max(1,window.devicePixelRatio||1);
var W=0,H=0;

document.documentElement.setAttribute("data-theme","dark");
document.getElementById("themeBtn").textContent="Clair";

function isDark(){
  var t=document.documentElement.getAttribute("data-theme");
  if(t==="dark") return true; if(t==="light") return false;
  return window.matchMedia("(prefers-color-scheme:dark)").matches;
}

var LON_MIN=-5.5,LON_MAX=10.5,LAT_MIN=41.0,LAT_MAX=51.8,PAD=26;
function mercLat(lat){var p=lat*Math.PI/180;return Math.log(Math.tan(Math.PI/4+p/2));}
var YMN=mercLat(LAT_MIN),YMX=mercLat(LAT_MAX);
function proj(lon,lat){
  return[PAD+(lon-LON_MIN)/(LON_MAX-LON_MIN)*(W-2*PAD),
         PAD+(1-(mercLat(lat)-YMN)/(YMX-YMN))*(H-2*PAD)];
}

function hexRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function rgba(h,a){var c=hexRgb(h);return"rgba("+c[0]+","+c[1]+","+c[2]+","+a+")";}
function lerpColor(h1,h2,t){
  var a=hexRgb(h1),b=hexRgb(h2);
  return"rgba("+(a[0]+t*(b[0]-a[0])|0)+","+(a[1]+t*(b[1]-a[1])|0)+","+(a[2]+t*(b[2]-a[2])|0)+",1)";
}

function buildSprites(){} // no-op — using plain circle glow instead

var regionPaths={},regionCentroids={};
var francePath=new Path2D();
function buildPaths(){
  regionPaths={};regionCentroids={};
  francePath=new Path2D();
  Object.keys(REGIONS).forEach(function(code){
    var p2=new Path2D(),pts=[];
    REGIONS[code].paths.forEach(function(ring){
      ring.forEach(function(pt,i){
        var xy=proj(pt[0],pt[1]);
        if(i===0){p2.moveTo(xy[0],xy[1]);francePath.moveTo(xy[0],xy[1]);}
        else{p2.lineTo(xy[0],xy[1]);francePath.lineTo(xy[0],xy[1]);}
        pts.push(xy);
      });
      p2.closePath();
      francePath.closePath();
    });
    regionPaths[code]=p2;
    var cx=0,cy=0;
    pts.forEach(function(p){cx+=p[0];cy+=p[1];});
    regionCentroids[code]=[cx/pts.length,cy/pts.length];
  });
}

// Projected point cache — all RTE units (all ≥ 40 MW by construction)
var heroPts=[];
function buildPoints(units){
  heroPts=[];
  _installedMW={};
  _filiereMax={};
  units.forEach(function(u){
    var f=u.filiere||"autre";
    var mw=u.cap_mw||0;
    _installedMW[f]=(_installedMW[f]||0)+mw;
    _filiereMax[f]=Math.max(_filiereMax[f]||0, mw);
    var xy=proj(u.lon,u.lat);
    heroPts.push({x:xy[0],y:xy[1],f:f,mw:mw,name:u.name,region:u.region||"",lat:u.lat,lon:u.lon});
  });
  heroPts.sort(function(a,b){return a.mw-b.mw;});
}

var hoveredHero=-1;

function draw(){
  ctx.save();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  var dark=isDark();
  var colors=dark?SRC_COLORS_DARK:SRC_COLORS_LIGHT;
  var accent=dark?"#2dd4bf":"#0f9c8f";
  var mapFill =dark?"rgba(255,255,255,.03)":"rgba(20,20,22,.04)";
  var mapStroke=dark?"rgba(255,255,255,.11)":"rgba(20,20,22,.18)";
  var labelCol =dark?"rgba(255,255,255,.38)":"rgba(20,20,22,.40)";

  // 1. Region fills + borders
  Object.keys(regionPaths).forEach(function(code){
    ctx.fillStyle=mapFill;
    ctx.fill(regionPaths[code]);
    ctx.strokeStyle=mapStroke; ctx.lineWidth=0.8; ctx.stroke(regionPaths[code]);
  });

  // 1b. Cloud raster overlay (bicubic, clipped to France)
  drawCloudRaster();

  // 2. Region labels
  ctx.font="500 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";
  ctx.textAlign="center"; ctx.fillStyle=labelCol;
  Object.keys(regionCentroids).forEach(function(code){
    var c=regionCentroids[code];
    ctx.fillText(REGIONS[code].nom,c[0],c[1]);
  });

  if(!heroPts.length){ctx.restore();return;}

  // PER-SITE: dim bg circle = capacité, filled sector = CF
  heroPts.forEach(function(p,i){
    var scf=_siteCF.length?Math.max(0,_siteCF[i]||0):Math.max(0,_capFactor[p.f]||0);
    var norm=p.mw/(_filiereMax[p.f]||p.mw||1);
    var coreR=R_MIN+Math.sqrt(norm)*(R_MAX-R_MIN);
    var col=colors[p.f];
    // Fond dim = zone vide (capacité non utilisée)
    ctx.beginPath();ctx.arc(p.x,p.y,coreR,0,Math.PI*2);
    ctx.fillStyle=rgba(col,0.10);ctx.fill();
    // Secteur = CF, from top clockwise
    if(scf>0.01){
      ctx.beginPath();
      ctx.moveTo(p.x,p.y);
      ctx.arc(p.x,p.y,coreR,-Math.PI/2,-Math.PI/2+scf*2*Math.PI);
      ctx.closePath();
      ctx.fillStyle=rgba(col,0.90);ctx.fill();
    }
    // Ring border
    ctx.beginPath();ctx.arc(p.x,p.y,coreR,0,Math.PI*2);
    ctx.strokeStyle=rgba(col,0.40);ctx.lineWidth=0.8;ctx.stroke();
  });

  // 5. Hover highlight
  if(hoveredHero>=0 && hoveredHero<heroPts.length){
    var p=heroPts[hoveredHero];
    var norm=p.mw/(_filiereMax[p.f]||p.mw||1);
    var r=R_MIN+Math.sqrt(norm)*(R_MAX-R_MIN)+5;
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2);
    ctx.strokeStyle=rgba(colors[p.f],0.9); ctx.lineWidth=1.5; ctx.stroke();
  }

  ctx.restore();
}

// Hover
canvas.addEventListener("mousemove",function(e){
  var rect=canvas.getBoundingClientRect();
  var mx=e.clientX-rect.left,my=e.clientY-rect.top;
  var found=-1,bestD=Infinity;
  heroPts.forEach(function(p,i){
    var norm=p.mw/(_filiereMax[p.f]||p.mw||1);
    var r=R_MIN+Math.sqrt(norm)*(R_MAX-R_MIN)+4;
    var dx=mx-p.x,dy=my-p.y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<=r&&d<bestD){bestD=d;found=i;}
  });
  if(found!==hoveredHero){hoveredHero=found;draw();}
  if(found>=0){
    var p=heroPts[found];
    document.getElementById("t-name").textContent=p.name;
    document.getElementById("t-type").textContent=F_LABEL[p.f];
    document.getElementById("t-region").textContent=p.region;
    document.getElementById("t-mw").textContent=(p.mw>=1000?(p.mw/1000).toFixed(2)+" GW":p.mw+" MW")+" installés";
    var scf=_siteCF.length?Math.max(0,_siteCF[found]||0):Math.max(0,_capFactor[p.f]||0);
    var liveMw=Math.round(p.mw*scf);
    document.getElementById("t-live").textContent=scf>0.01?"≈ "+liveMw+" MW produits (site "+Math.round(scf*100)+"%)":"à l'arrêt";
    tooltip.style.left=(e.clientX-rect.left)+"px";
    tooltip.style.top=(e.clientY-rect.top)+"px";
    tooltip.classList.add("show");
    canvas.style.cursor="pointer";
  }else{tooltip.classList.remove("show");canvas.style.cursor="default";}
});
canvas.addEventListener("mouseleave",function(){
  if(hoveredHero!==-1){hoveredHero=-1;draw();}
  tooltip.classList.remove("show");canvas.style.cursor="default";
});

document.getElementById("themeBtn").addEventListener("click",function(){
  var dark=isDark();
  document.documentElement.setAttribute("data-theme",dark?"light":"dark");
  this.textContent=dark?"Sombre":"Clair";
  buildSprites(!dark);draw();
});

var _sprData=null;
function resize(){
  var rect=canvas.getBoundingClientRect();
  W=rect.width;H=rect.height;
  canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
  wCanvas.width=Math.round(W*dpr);wCanvas.height=Math.round(H*dpr);
  buildPaths();
  if(_sprData){buildPoints(_sprData);}
  buildSprites(isDark());
  // Rebuild weather resources if grid is loaded
  if(_cloudGrid){
    buildRaster();
    buildUVMap();
    buildFranceMask();
    buildSpawnPool();
    if(particles.length) initParticles();
  }
  draw();
}

fetch("units-combined.json").then(function(r){return r.json();}).then(function(units){
  _sprData=units;
  buildPoints(units);
  buildSprites(isDark());
  loadingOverlay.classList.add("hidden");
  draw();
  loadMix();
  setInterval(loadMix, 5*60*1000);
}).catch(function(e){console.error(e);loadingOverlay.textContent="Erreur de chargement.";});

var rsTimer;
window.addEventListener("resize",function(){clearTimeout(rsTimer);rsTimer=setTimeout(resize,100);});
setTimeout(resize,0);

})();
</script>
