name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  # ── Tests (run once, gate everything) ───────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        working-directory: app_v2
        run: uv sync --all-extras

      - name: Run tests
        working-directory: app_v2
        run: uv run python -m pytest tests/ -q --tb=short

  # ── Semantic release (version bump + changelog) ─────────────────────────────
  release:
    name: Release
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: app_v2
        run: npm ci

      - name: Semantic Release
        working-directory: app_v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  # ── Azure Functions deployment ───────────────────────────────────────────────
  deploy-functions:
    name: Deploy Azure Functions
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare deployment package
        run: |
          cp app_v2/host.json app_v2/functions/
          TARGET=app_v2/functions/.python_packages/lib/site-packages
          # Most packages: manylinux_2_28 avoids glibc 2.33/2.34 incompatibility on Azure
          pip install \
            --platform manylinux_2_28_x86_64 \
            --python-version 3.11 \
            --implementation cp \
            --abi cp311 \
            --only-binary=:all: \
            --target $TARGET \
            $(grep -v 'psycopg2' app_v2/functions/requirements.txt | grep -v '^#' | grep -v '^$' | tr '\n' ' ')
          # psycopg2-binary ships manylinux_2_17 wheels (glibc 2.17, fine on Azure glibc 2.31)
          pip install \
            --platform manylinux_2_17_x86_64 \
            --python-version 3.11 \
            --implementation cp \
            --abi cp311 \
            --only-binary=:all: \
            --target $TARGET \
            "psycopg2-binary>=2.9.0"
          cd app_v2/functions && zip -r /tmp/functions.zip . && cd ../..

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Functions
        run: |
          az functionapp deployment source config-zip \
            --name ${{ secrets.AZURE_FUNCTIONAPP_NAME }} \
            --resource-group watt-watcher-rg \
            --src /tmp/functions.zip

  # ── VPS deployment (api/ + frontend/, via docker compose over SSH) ──────────
  deploy-vps:
    name: Deploy VPS (api + frontend)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          port: 5790
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/ubuntu/dev/WATT_WATCHER
            git pull origin main
            cd app_v2
            docker compose up --build -d
